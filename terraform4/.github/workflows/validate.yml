name: Terraform Validate

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'providers.tf'
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'providers.tf'

env:
  TF_VAR_region: ap-southeast-1

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

  init:
    name: Terraform Init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform Init
        run: terraform init -input=false

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: [fmt-check, init]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Validate
        run: terraform validate -no-color

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [fmt-check, init, validate]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Plan
        run: terraform plan -input=false -no-color
        env:
          AWS_DEFAULT_REGION: ap-southeast-1

  security-scan:
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    needs: [fmt-check, init]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1
        with:
          tfsec_args: '--no-color -m HIGH'

  lint:
    name: Lint (tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v3
        with:
          tflint_version: 0.50.0
      - name: tflint
        run: tflint --filter .
